apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: docu-scale

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: 084847996093.dkr.ecr.eu-north-1.amazonaws.com/docu-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000

          env:
            - name: PORT
              value: "3000"

            - name: DB_USER
              value: admin

            - name: DB_HOST
              value: postgres-service

            - name: DB_NAME
              value: docudb

            - name: DB_PASSWORD
              value: password

            - name: DB_PORT
              value: "5432"

              env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_ACCESS_KEY_ID

            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_SECRET_ACCESS_KEY

            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_REGION

            - name: AWS_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: aws-secret
                  key: AWS_BUCKET_NAME